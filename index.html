<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Wuffel 🎲</title>
  <meta name="description" content="Wuffel – der bunte Würfel-Generator für unterwegs" />
  <meta name="theme-color" content="#7c3aed" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wuffel" />
  <meta property="og:title" content="Wuffel 🎲 – der bunte Würfel" />
  <meta property="og:description" content="Bunte, animierte Würfel für unterwegs – W4 bis W20, freier Zahlenbereich und Buchstabenwürfel für Stadt-Land-Fluss." />
  <meta property="og:url" content="https://wuffel.nichtregistriert.de/" />
  <meta property="og:image" content="https://wuffel.nichtregistriert.de/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="de_DE" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wuffel 🎲 – der bunte Würfel" />
  <meta name="twitter:description" content="Bunte, animierte Würfel für unterwegs – W4 bis W20, freier Zahlenbereich und Buchstabenwürfel für Stadt-Land-Fluss." />
  <meta name="twitter:image" content="https://wuffel.nichtregistriert.de/icons/og-image.png" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wuffel" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1><span class="logo-dot">🎲</span> Wuffel</h1>
    <p class="subtitle">Würfeln, wo ihr wollt</p>
  </header>

  <main>
    <div id="dice-container" class="dice-container" aria-live="polite"></div>

    <div id="sum-display" class="sum-display" hidden aria-live="polite">
      Summe: <span id="sum-value">0</span>
    </div>

    <div class="toolbar">
      <button id="roll-all-btn" class="btn btn-primary btn-large">🎲 Alle würfeln</button>

      <div class="stepper" role="group" aria-label="Anzahl Würfel">
        <button id="remove-die-btn" class="stepper-btn" aria-label="Würfel entfernen">−</button>
        <span class="stepper-count"><span id="dice-count">1</span> Würfel</span>
        <button id="add-die-btn" class="stepper-btn" aria-label="Würfel hinzufügen">+</button>
      </div>

      <div class="toolbar-utility">
        <select id="preset-select" class="btn btn-ghost" aria-label="Vorlage wählen">
          <option value="" selected disabled>📋 Vorlagen</option>
          <option value="w6x1">1 × W6</option>
          <option value="w6x2">2 × W6</option>
          <option value="kniffel">Kniffel (5 × W6)</option>
          <option value="slf">Stadt-Land-Fluss (Buchstabe)</option>
        </select>
        <button id="settings-btn" class="btn btn-ghost">⚙️ Einstellungen</button>
        <button id="reset-btn" class="btn btn-ghost" title="Auf einen Standard-W6 zurücksetzen">↺ Zurücksetzen</button>
        <button id="mute-btn" class="btn btn-ghost" title="Ton &amp; Vibration an/aus" aria-label="Ton &amp; Vibration an/aus">🔊 Ton</button>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <p>Installierbar als App 📱 · funktioniert offline</p>
    <p><a href="https://github.com/dasistdaniel/wuffel" target="_blank" rel="noopener">Quellcode auf GitHub</a></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="settings-overlay" class="settings-overlay" hidden>
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
      <div class="settings-modal-header">
        <h2 id="settings-modal-title">⚙️ Würfel-Einstellungen</h2>
        <button id="settings-close-btn" class="modal-close" aria-label="Schließen">✕</button>
      </div>
      <div id="settings-list" class="settings-list"></div>
    </div>
  </div>

  <template id="die-template">
    <div class="die-card">
      <button class="die-face" type="button" aria-label="Würfel werfen">
        <div class="die-face-inner"></div>
      </button>
      <span class="die-type-label"></span>
    </div>
  </template>

  <template id="settings-item-template">
    <div class="settings-item">
      <div class="settings-item-header">
        <span class="settings-item-swatch"></span>
        <span class="settings-item-title"></span>
      </div>
      <label class="settings-row">
        Typ
        <select class="cfg-type">
          <option value="d4">W4</option>
          <option value="d6">W6</option>
          <option value="d8">W8</option>
          <option value="d10">W10</option>
          <option value="d12">W12</option>
          <option value="d20">W20</option>
          <option value="custom">Zahlenbereich</option>
          <option value="letters">Buchstaben</option>
        </select>
      </label>
      <label class="settings-row cfg-row-custom" hidden>
        Von
        <input class="cfg-min" type="number" />
      </label>
      <label class="settings-row cfg-row-custom" hidden>
        Bis
        <input class="cfg-max" type="number" />
      </label>
      <label class="settings-row cfg-row-letters" hidden>
        Buchstaben
        <textarea class="cfg-letters" rows="2" spellcheck="false"></textarea>
      </label>
      <label class="settings-row">
        Farbe
        <input class="cfg-color" type="color" />
      </label>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
